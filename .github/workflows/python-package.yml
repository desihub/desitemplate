# Workflow is based on the Astropy GitHub actions workflow, ci_workflows.yml
name: CI

on:
    push:
        branches:
            - '*'
        tags:
            - '*'
    pull_request:

jobs:
    tests:
        name: Unit tests
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    - os: ubuntu-latest
                      coverage: test
                      python-version: '3.14'
                      numpy-version: ''
                      astropy-version: ''
                    - os: ubuntu-latest
                      coverage: coverage
                      python-version: '3.13'
                      numpy-version: '<3'
                      astropy-version: '<8'
                    - os: ubuntu-latest
                      coverage: test
                      python-version: '3.12'
                      numpy-version: '<2.3'
                      astropy-version: '<7.1'
                    - os: ubuntu-latest
                      coverage: test
                      python-version: '3.11'
                      numpy-version: '<2.1'
                      astropy-version: '<7'
                    - os: ubuntu-latest
                      coverage: test
                      python-version: '3.10'
                      numpy-version: '<2'
                      astropy-version: '<6.1'

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                python-version: ${{ matrix.python-version }}
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip setuptools wheel
                python -m pip install --upgrade --upgrade-strategy only-if-needed "numpy${{ matrix.numpy-version }}"
                python -m pip install --upgrade --upgrade-strategy only-if-needed "astropy${{ matrix.astropy-version }}"
            - name: Install the package itself
              run: python -m pip install --editable .[${{ matrix.coverage }}]
            - name: Run the test
              run: bash -c 'if [[ "${{ matrix.coverage }}" == "coverage" ]]; then pytest --cov; else pytest; fi'
            - name: Coveralls
              if: ${{ matrix.coverage == 'coverage' }}
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
              run: coveralls

    docs:
        name: Doc test
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                  - ubuntu-latest
                python-version:
                  - '3.13'

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                python-version: ${{ matrix.python-version }}
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip setuptools wheel
                python -m pip install --editable .[doc]
            - name: Test the documentation
              run: sphinx-build -W --keep-going -b html doc doc/_build/html

    api:
        name: API doc completeness test
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                  - ubuntu-latest
                python-version:
                  - '3.13'

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                python-version: ${{ matrix.python-version }}
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip setuptools wheel desiutil
            - name: Generate api.rst
              run: desi_api_file --api ./api.rst desitemplate
            - name: Compare generated api.rst to checked-in version
              # We allow failures here because the doc/api.rst file has some
              # meta-documentation that would not be included in a production
              # package.
              continue-on-error: true
              run: diff --ignore-space-change --ignore-blank-lines ./api.rst ./doc/api.rst

    scripts:
        name: Script definition completeness test
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                  - ubuntu-latest
                python-version:
                  - '3.13'

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Compare contents of bin/ to options.scripts in setup.cfg
              run: python -c 'import os; import sys; import tomllib; t = open("pyproject.toml", "rb"); pyproject = tomllib.load(t); t.close(); scripts = [os.path.basename(s) for s in pyproject["tool"]["setuptools"]["script-files"]]; sys.exit(int(set(os.listdir("bin")) != set(scripts)))'

    style:
        name: Style check
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                  - ubuntu-latest
                python-version:
                  - '3.10'

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                python-version: ${{ matrix.python-version }}
            - name: Install Python dependencies
              run: python -m pip install --upgrade pip setuptools wheel pycodestyle flake8
            - name: Test the style
              # This is equivalent to an allowed falure.
              # continue-on-error: true
              run: pycodestyle --count --statistics py/desitemplate
            - name: Test the style and code use more rigorously with flake8
              # This is equivalent to an allowed falure.
              continue-on-error: true
              run: flake8 --statistics --count py/desitemplate
